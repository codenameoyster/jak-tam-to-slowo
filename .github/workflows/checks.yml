name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    # The image has Node 24 and the browsers with their system packages; --init reaps stopped Worker processes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm install --global bun@1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:browser
      - run: bunx wrangler deploy --dry-run --outdir .wrangler/dry-run
