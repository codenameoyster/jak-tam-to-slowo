name = "jak-tam-to-slowo"
account_id = "d89bca31204306ee78e165e9f8ebd3be"
main = "src/index.ts"
compatibility_date = "2026-10-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "learn.rustatian.me", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "jak-tam-to-slowo"
database_id = "3e8c178e-be58-462c-bf9c-0e76543c9429"
migrations_dir = "migrations"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Previews of other branches use their own D1 database and login limiter. wrangler.preview-migrations.toml applies the migrations to that database.
[[previews.d1_databases]]
binding = "DB"
database_name = "jak-tam-to-slowo-preview"
database_id = "48f31176-bc5f-427a-85c6-ef06cceb0ebd"
migrations_dir = "migrations"

[[previews.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[build]
command = "bun run build"
watch_dir = ["src", "web", "shared", "public"]

[dev]
ip = "127.0.0.1"
host = "127.0.0.1:8787"
port = 8787
local_protocol = "http"

[secrets]
required = ["ACCOUNTS", "ANTHROPIC_API_KEY", "OPENAI_TRANSCRIPTION_API_KEY"]

[observability]
enabled = true

[observability.traces]
enabled = true
